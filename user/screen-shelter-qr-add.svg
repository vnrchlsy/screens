    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Add your QR</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Add your donation QR</text><text x="34" y="202" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Donors scan this to give straight to your e-wallet.</text><text x="34" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Provider</text><rect x="34" y="268" width="94" height="52" rx="26" fill="#1C6B6B" stroke="#1C6B6B" stroke-width="1.5"/><text x="81" y="302" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">GCash</text><rect x="142" y="268" width="82" height="52" rx="26" fill="#ffffff" filter="url(#v2sh)"/><text x="183" y="302" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle" letter-spacing="0">Maya</text><rect x="34" y="348" width="472" height="220" rx="24" fill="#ffffff" stroke="#e3e1d9" stroke-width="2" stroke-dasharray="7 8"/><circle cx="270" cy="426" r="38" fill="#e7f0ef"/><line x1="270" y1="410" x2="270" y2="442" stroke="#1C6B6B" stroke-width="4" stroke-linecap="round"/><line x1="254" y1="426" x2="286" y2="426" stroke="#1C6B6B" stroke-width="4" stroke-linecap="round"/><text x="270" y="496" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">Upload your QR image</text><text x="270" y="524" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">Screenshot or save it from your GCash/Maya app.</text><rect x="34" y="596" width="472" height="82" rx="22" fill="#ffffff" filter="url(#v2soft)"/><text x="60" y="626" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5f5e5a" text-anchor="start" letter-spacing="0.4">Account holder name</text><text x="60" y="660" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">PAWS Manila</text><text x="34" y="688" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Must match your org name — this is what we check it against.</text><rect x="34" y="720" width="472" height="60" rx="16" fill="#FAEEDA"/><circle cx="70" cy="750" r="16" fill="none" stroke="#633806" stroke-width="4"/><line x1="70" y1="742.8" x2="70" y2="751.92" stroke="#633806" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="757.2" r="2.8" fill="#633806"/><text x="102" y="754" font-family="Arial, sans-serif" font-size="14.5" font-weight="600" fill="#633806" text-anchor="start" letter-spacing="0">An admin checks this before it goes live for donors.</text><rect x="34" y="806" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="849" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Submit for review</text></g></g>

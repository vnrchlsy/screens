    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Offer help</text><circle cx="270" cy="238" r="70" fill="#e7f0ef"/><path d="M234.8 244.4 q0 -17.92 14.08 -19.2 l10.24 -16.64 h21.76 l10.24 16.64 q14.08 0.02 14.08 19.2 z" fill="#14504F"/><circle cx="252.07999999999998" cy="248.88" r="7.04" fill="#14504F"/><circle cx="287.92" cy="248.88" r="7.04" fill="#14504F"/><text x="270" y="366" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Offer sent</text><text x="270" y="406" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">Ana can see that someone's ready</text><text x="270" y="434" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">to drive — that helps.</text><rect x="34" y="478" width="472" height="70" rx="18" fill="#FAEEDA"/><circle cx="70" cy="513" r="16" fill="none" stroke="#633806" stroke-width="4"/><line x1="70" y1="505.8" x2="70" y2="514.92" stroke="#633806" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="520.2" r="2.8" fill="#633806"/><text x="100" y="507" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#633806" text-anchor="start" letter-spacing="0">The case is still unclaimed.</text><text x="100" y="531" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#8a5a12" text-anchor="start" letter-spacing="0">It stays on the map until someone goes.</text><text x="34" y="606" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">What happens next</text><rect x="34" y="626" width="472" height="260" rx="20" fill="#ffffff" filter="url(#v2sh)"/><circle cx="76" cy="660.8" r="6" fill="#1C6B6B"/><path d="M65.2 680.6 a10.799999999999999 12 0 0 1 21.599999999999998 0 z" fill="#1C6B6B"/><text x="120" y="664" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Someone claims it</text><text x="120" y="690" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">They get your number and call you.</text><circle cx="76" cy="750" r="17" fill="none" stroke="#1C6B6B" stroke-width="4"/><line x1="76" y1="750" x2="76" y2="740.65" stroke="#1C6B6B" stroke-width="4" stroke-linecap="round"/><line x1="76" y1="750" x2="83.14" y2="753.06" stroke="#1C6B6B" stroke-width="4" stroke-linecap="round"/><text x="120" y="746" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">No one claims in 48 h</text><text x="120" y="772" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Your offer expires — we'll ask again if it reopens.</text><path d="M65.8 833.8 a10.799999999999999 10.799999999999999 0 1 1 3.5999999999999996 7.800000000000001" fill="none" stroke="#1C6B6B" stroke-width="3.9000000000000004" stroke-linecap="round"/><polyline points="60.4,829 65.8,834.4 71.8,829.6" fill="none" stroke="#1C6B6B" stroke-width="3.9000000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="828" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">You change your mind</text><text x="120" y="854" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Withdraw any time from My rescues › Offers.</text><rect x="34" y="922" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="965" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Back to the map</text><text x="270" y="1026" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#b8b6ad" text-anchor="middle" letter-spacing="0">Still able to go yourself? You can claim it.</text></g></g>

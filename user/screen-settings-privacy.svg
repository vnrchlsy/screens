<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1230" viewBox="0 0 600 1230">
    <rect x="4" y="4" width="592" height="1222" rx="76" fill="#11241f"/>
    <rect x="30" y="30" width="540" height="1170" rx="48" fill="#ffffff"/>
    <clipPath id="sc"><rect x="30" y="30" width="540" height="1170" rx="48"/></clipPath>
    <defs>
  <filter id="v2sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1F3A5F" flood-opacity="0.10"/></filter>
  <filter id="v2soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3A5F" flood-opacity="0.08"/></filter>
  <linearGradient id="v2btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#238383"/><stop offset="1" stop-color="#14504F"/></linearGradient>
  <linearGradient id="v2danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C94A44"/><stop offset="1" stop-color="#9E322D"/></linearGradient>
  <linearGradient id="v2hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C6B6B"/><stop offset="1" stop-color="#11241F"/></linearGradient>
  <linearGradient id="v2fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F5F2" stop-opacity="0"/><stop offset="0.5" stop-color="#F4F5F2" stop-opacity="0.9"/><stop offset="1" stop-color="#F4F5F2"/></linearGradient>
</defs>
    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Privacy</text><text x="34" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5f5e5a" text-anchor="start" letter-spacing="1.5">NOTIFICATIONS</text><rect x="34" y="168" width="472" height="184" rx="20" fill="#ffffff" filter="url(#v2sh)"/><text x="58" y="202" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Push notifications</text><text x="58" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Rescue updates, matches, and requests.</text><rect x="420" y="194" width="54" height="31" rx="15.5" fill="#1C6B6B"/><circle cx="458" cy="209.5" r="12.5" fill="#ffffff" filter="url(#v2soft)"/><line x1="58" y1="260" x2="482" y2="260" stroke="#e3e1d9" stroke-width="1.5"/><text x="58" y="294" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Marketing emails</text><text x="58" y="322" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">News and campaigns. Off unless you ask.</text><rect x="420" y="286" width="54" height="31" rx="15.5" fill="#d8d6cd"/><circle cx="436" cy="301.5" r="12.5" fill="#ffffff" filter="url(#v2soft)"/><text x="34" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5f5e5a" text-anchor="start" letter-spacing="1.5">ANALYTICS</text><rect x="34" y="398" width="472" height="116" rx="20" fill="#ffffff" filter="url(#v2sh)"/><text x="58" y="432" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Help improve Kupkop</text><text x="58" y="460" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Anonymous usage only — never your pets,</text><text x="58" y="484" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">reports, or the people you talk to.</text><rect x="420" y="424" width="54" height="31" rx="15.5" fill="#d8d6cd"/><circle cx="436" cy="439.5" r="12.5" fill="#ffffff" filter="url(#v2soft)"/><text x="34" y="544" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Off by default. Turn it on or off any time —</text><text x="34" y="568" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">switching it off stops collection straight away.</text><text x="34" y="602" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5f5e5a" text-anchor="start" letter-spacing="1.5">ALWAYS ON</text><rect x="34" y="620" width="472" height="208" rx="20" fill="#ffffff" filter="url(#v2sh)"/><path d="M72 649 l11 4 v7 c0 7 -5 10 -11 12 c-6 -2 -11 -5 -11 -12 v-7 z" fill="none" stroke="#1C6B6B" stroke-width="2.4"/><polyline points="67,662 71,666 78,657" fill="none" stroke="#1C6B6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="662" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Your location is city-only</text><text x="104" y="690" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">We never store your exact address or</text><text x="104" y="712" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">coordinates — only the city you pick.</text><line x1="58" y1="732" x2="482" y2="732" stroke="#e3e1d9" stroke-width="1.5"/><path d="M72 761 l11 4 v7 c0 7 -5 10 -11 12 c-6 -2 -11 -5 -11 -12 v-7 z" fill="none" stroke="#1C6B6B" stroke-width="2.4"/><polyline points="67,774 71,778 78,769" fill="none" stroke="#1C6B6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="774" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Your number stays hidden</text><text x="104" y="802" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Shared only with a shelter you sign up</text><text x="104" y="824" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">to volunteer for, and only for that shift.</text></g></g>
    <rect x="240" y="44" width="120" height="30" rx="15" fill="#11241f"/>
  </svg>
  <linearGradient id="v2fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F5F2" stop-opacity="0"/><stop offset="0.5" stop-color="#F4F5F2" stop-opacity="0.9"/><stop offset="1" stop-color="#F4F5F2"/></linearGradient>
</defs>
    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">List for adoption</text><circle cx="270" cy="238" r="70" fill="#e7f0ef"/><path d="M270 208.88 L300.8 235.2 L292.4 235.2 L292.4 266 L247.6 266 L247.6 235.2 L239.2 235.2 Z" fill="#14504F"/><path d="M270 254.95680000000002 C 257.064 245.5488, 259.6512 236.1408, 266.0016 240.3744 C 268.824 242.256, 271.176 242.256, 273.9984 240.3744 C 280.3488 236.1408, 282.936 245.5488, 270 254.95680000000002 Z" fill="#ffffff"/><text x="270" y="366" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">She's listed!</text><text x="270" y="406" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">She's on the public adopt feed now —</text><text x="270" y="434" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">adopters near you can find and inquire.</text><rect x="34" y="478" width="472" height="70" rx="18" fill="#e7f0ef"/><path d="M70 497.4 L86.5 511.5 L82 511.5 L82 528 L58 528 L58 511.5 L53.5 511.5 Z" fill="#14504F"/><path d="M70 522.084 C 63.07 517.044, 64.456 512.0039999999999, 67.858 514.2719999999999 C 69.37 515.28, 70.63 515.28, 72.142 514.2719999999999 C 75.544 512.0039999999999, 76.93 517.044, 70 522.084 Z" fill="#ffffff"/><text x="100" y="507" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#14504F" text-anchor="start" letter-spacing="0">She stays in your care</text><text x="100" y="531" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">until an adoption is final — now a tracked record.</text><text x="34" y="606" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">What happens next</text><rect x="34" y="626" width="472" height="260" rx="20" fill="#ffffff" filter="url(#v2sh)"/><rect x="63" y="659" width="26" height="18" rx="3" fill="none" stroke="#1C6B6B" stroke-width="2.5"/><path d="M63 662 l13 9 l13 -9" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="664" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Adopters inquire</text><text x="120" y="690" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Requests land in your list to review.</text><path d="M63 734 h18 l8 8 v24 h-26 z" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><path d="M81 734 v8 h8" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><line x1="70" y1="753" x2="85" y2="753" stroke="#1C6B6B" stroke-width="2.5"/><line x1="70" y1="761" x2="85" y2="761" stroke="#1C6B6B" stroke-width="2.5"/><text x="120" y="746" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Run the steps you want</text><text x="120" y="772" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Application, home check, interview — or skip.</text><path d="M76 816.4 L92.5 830.5 L88 830.5 L88 847 L64 847 L64 830.5 L59.5 830.5 Z" fill="#1C6B6B"/><path d="M76 841.084 C 69.07 836.044, 70.456 831.0039999999999, 73.858 833.2719999999999 C 75.37 834.28, 76.63 834.28, 78.142 833.2719999999999 C 81.544 831.0039999999999, 82.93 836.044, 76 841.084 Z" fill="#ffffff"/><text x="120" y="828" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">On adoption, she's home</text><text x="120" y="854" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">She becomes a tracked pet on their account.</text><rect x="34" y="922" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="965" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Back to my rescues</text><text x="270" y="1026" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#b8b6ad" text-anchor="middle" letter-spacing="0">Edit or unlist anytime from My listings.</text></g></g>
    <rect x="240" y="44" width="120" height="30" rx="15" fill="#11241f"/>

B6B" text-anchor="middle" letter-spacing="0">G</text><text x="136.5" y="865" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Google</text><rect x="276" y="826" width="230" height="64" rx="32" fill="#ffffff" filter="url(#v2sh)"/><path d="M358.75 852.8 c -7.8 0 -10.92 5.72 -8.84 11.96 c 1.3 5.2 5.2 8.32 8.84 8.32 c 3.6400000000000006 0 7.539999999999999 -3.12 8.84 -8.32 c 2.08 -6.24 -1.04 -11.96 -8.84 -11.96 z" fill="#12213A"/><path d="M359.53 852.28 c 0.52 -3.38 3.12 -5.46 4.94 -5.72 c 0.26 3.12 -2.08 5.46 -4.94 5.72 z" fill="#12213A"/><text x="383.75" y="865" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Apple</text><text x="270" y="940" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">Already have an account?  Log in</text><text x="270" y="1000" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#9a988f" text-anchor="middle" letter-spacing="0">By creating an account you agree to our</text><text x="270" y="1024" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#9a988f" text-anchor="middle" letter-spacing="0">Terms &amp; Privacy Policy.</text></g></g>

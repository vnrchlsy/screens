<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1230" viewBox="0 0 600 1230">
    <rect x="4" y="4" width="592" height="1222" rx="76" fill="#11241f"/>
    <rect x="30" y="30" width="540" height="1170" rx="48" fill="#ffffff"/>
    <clipPath id="sc"><rect x="30" y="30" width="540" height="1170" rx="48"/></clipPath>
    <defs>
  <filter id="v2sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1F3A5F" flood-opacity="0.10"/></filter>
  <filter id="v2soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3A5F" flood-opacity="0.08"/></filter>
  <linearGradient id="v2btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#238383"/><stop offset="1" stop-color="#14504F"/></linearGradient>
  <linearGradient id="v2danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C94A44"/><stop offset="1" stop-color="#9E322D"/></linearGradient>
  <linearGradient id="v2hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C6B6B"/><stop offset="1" stop-color="#11241F"/></linearGradient>
  <linearGradient id="v2fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F5F2" stop-opacity="0"/><stop offset="0.5" stop-color="#F4F5F2" stop-opacity="0.9"/><stop offset="1" stop-color="#F4F5F2"/></linearGradient>
</defs>
    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Place with someone</text><circle cx="270" cy="238" r="70" fill="#e7f0ef"/><circle cx="270" cy="238" r="40" fill="none" stroke="#14504F" stroke-width="4"/><line x1="270" y1="238" x2="270" y2="216" stroke="#14504F" stroke-width="4" stroke-linecap="round"/><line x1="270" y1="238" x2="286.8" y2="245.2" stroke="#14504F" stroke-width="4" stroke-linecap="round"/><text x="270" y="366" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Waiting for Ana</text><text x="270" y="406" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">She's been notified. Nothing changes</text><text x="270" y="434" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">until she accepts.</text><rect x="34" y="478" width="472" height="70" rx="18" fill="#e7f0ef"/><path d="M70 497.4 L86.5 511.5 L82 511.5 L82 528 L58 528 L58 511.5 L53.5 511.5 Z" fill="#14504F"/><path d="M70 522.084 C 63.07 517.044, 64.456 512.0039999999999, 67.858 514.2719999999999 C 69.37 515.28, 70.63 515.28, 72.142 514.2719999999999 C 75.544 512.0039999999999, 76.93 517.044, 70 522.084 Z" fill="#ffffff"/><text x="100" y="507" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#14504F" text-anchor="start" letter-spacing="0">She's still with you</text><text x="100" y="531" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Her status stays Safe until the handover.</text><text x="34" y="606" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">What happens next</text><rect x="34" y="626" width="472" height="260" rx="20" fill="#ffffff" filter="url(#v2sh)"/><circle cx="76" cy="660.8" r="6" fill="#1C6B6B"/><path d="M65.2 680.6 a10.799999999999999 12 0 0 1 21.599999999999998 0 z" fill="#1C6B6B"/><text x="120" y="664" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Ana accepts</text><text x="120" y="690" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">She becomes the owner on record.</text><path d="M59.5 753 q0 -8.4 6.6 -9 l4.8 -7.800000000000001 h10.200000000000001 l4.8 7.800000000000001 q6.6 0.02 6.6 9 z" fill="#1C6B6B"/><circle cx="67.6" cy="755.1" r="3.3" fill="#1C6B6B"/><circle cx="84.4" cy="755.1" r="3.3" fill="#1C6B6B"/><text x="120" y="746" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">You arrange the handover</text><text x="120" y="772" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Her number is shared so you can meet.</text><path d="M65.8 833.8 a10.799999999999999 10.799999999999999 0 1 1 3.5999999999999996 7.800000000000001" fill="none" stroke="#1C6B6B" stroke-width="3.9000000000000004" stroke-linecap="round"/><polyline points="60.4,829 65.8,834.4 71.8,829.6" fill="none" stroke="#1C6B6B" stroke-width="3.9000000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="828" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">She declines, or doesn't answer</text><text x="120" y="854" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Nothing happens — you can place or list again.</text><rect x="34" y="922" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="965" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Back to my rescues</text><text x="270" y="1026" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#b8b6ad" text-anchor="middle" letter-spacing="0">You can cancel this while it's pending.</text></g></g>
    <rect x="240" y="44" width="120" height="30" rx="15" fill="#11241f"/>
  </svg>
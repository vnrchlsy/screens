  <linearGradient id="v2danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C94A44"/><stop offset="1" stop-color="#9E322D"/></linearGradient>
  <linearGradient id="v2hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C6B6B"/><stop offset="1" stop-color="#11241F"/></linearGradient>
  <linearGradient id="v2fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F5F2" stop-opacity="0"/><stop offset="0.5" stop-color="#F4F5F2" stop-opacity="0.9"/><stop offset="1" stop-color="#F4F5F2"/></linearGradient>
</defs>
    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Get verified</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Quick verification</text><text x="34" y="204" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Two things and you're set.</text><rect x="34" y="258" width="472" height="112" rx="20" fill="#ffffff" filter="url(#v2sh)"/><rect x="54" y="282" width="64" height="64" rx="19.84" fill="#e7f0ef"/><path d="M73 298 h18 l8 8 v24 h-26 z" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><path d="M91 298 v8 h8" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><line x1="80" y1="317" x2="95" y2="317" stroke="#1C6B6B" stroke-width="2.5"/><line x1="80" y1="325" x2="95" y2="325" stroke="#1C6B6B" stroke-width="2.5"/><text x="140" y="308" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Valid government ID</text><text x="140" y="338" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">A clear photo of your ID · Required</text><circle cx="466" cy="298" r="16" fill="#EAF3DE"/><polyline points="459,298 464,304 474,291" fill="none" stroke="#27500A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="486" y="342" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="end" letter-spacing="0">maria-id.jpg</text><rect x="34" y="412" width="472" height="82" rx="22" fill="#ffffff" filter="url(#v2soft)"/><text x="60" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5f5e5a" text-anchor="start" letter-spacing="0.4">Social link</text><text x="60" y="476" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">facebook.com/maria.santos</text><text x="34" y="542" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">About you (optional)</text><rect x="34" y="558" width="472" height="108" rx="16" fill="#ffffff" filter="url(#v2sh)"/><text x="58" y="596" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#9a988f" text-anchor="start" letter-spacing="0">I've fostered aspins in QC since 2022…</text><rect x="34" y="690" width="472" height="74" rx="18" fill="#eaf4f2"/><rect x="58" y="712" width="30" height="30" rx="8" fill="#1C6B6B"/><polyline points="65,727 71,734 82,720" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="722" font-family="Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1F3A5F" text-anchor="start" letter-spacing="0">I consent to Kupkop PH collecting these documents</text><text x="102" y="744" font-family="Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1F3A5F" text-anchor="start" letter-spacing="0">solely to verify my identity.</text><text x="34" y="826" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">A Kupkop admin reviews this — usually within a day.</text><rect x="34" y="864" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="907" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Submit for review</text><rect width="540" height="1170" fill="#0d1826" opacity="0.55"/><rect x="50" y="316" width="440" height="536" rx="26" fill="#ffffff" filter="url(#v2sh)"/><circle cx="270" cy="404" r="52" fill="#EAF3DE"/><polyline points="246,404 264,422 296,384" fill="none" stroke="#27500A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="500" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Request submitted</text><text x="270" y="538" font-family="Arial, sans-serif" font-size="15.5" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">We’ve got your ID and social link.</text><rect x="86" y="576" width="368" height="92" rx="16" fill="#e7f0ef"/><circle cx="126" cy="622" r="16" fill="none" stroke="#14504F" stroke-width="4"/><line x1="126" y1="622" x2="126" y2="613.2" stroke="#14504F" stroke-width="4" stroke-linecap="round"/><line x1="126" y1="622" x2="132.72" y2="624.88" stroke="#14504F" stroke-width="4" stroke-linecap="round"/><text x="158" y="610" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14504F" text-anchor="start" letter-spacing="0">This takes a few days</text><text x="158" y="634" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">A person reviews every request — usually</text><text x="158" y="654" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">2–3 business days. We’ll notify you.</text><text x="270" y="712" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#a9adaa" text-anchor="middle" letter-spacing="0">You can use everything else while you wait.</text><rect x="86" y="734" width="368" height="64" rx="32" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="774" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Back to home</text><text x="270" y="832" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#14504F" text-anchor="middle" letter-spacing="0">Track my documents</text></g></g>

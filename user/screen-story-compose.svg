cing="0.4">Caption</text><rect x="34" y="386" width="472" height="128" rx="18" fill="#ffffff" filter="url(#v2sh)"/><text x="58" y="424" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#9a988f" text-anchor="start" letter-spacing="0">Tell people what happened —</text><text x="58" y="452" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#9a988f" text-anchor="start" letter-spacing="0">how you met, how it's going now.</text><text x="34" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#5f5e5a" text-anchor="start" letter-spacing="0.4">Link to (optional)</text><rect x="34" y="578" width="166" height="52" rx="26" fill="#1C6B6B" stroke="#1C6B6B" stroke-width="1.5"/><text x="117" y="612" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">An adoption</text><rect x="214" y="578" width="130" height="52" rx="26" fill="#ffffff" filter="url(#v2sh)"/><text x="279" y="612" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle" letter-spacing="0">A rescue</text><rect x="358" y="578" width="118" height="52" rx="26" fill="#ffffff" filter="url(#v2sh)"/><text x="417" y="612" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle" letter-spacing="0">Nothing</text><text x="34" y="676" font-family="Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#9a988f" text-anchor="start" letter-spacing="0">We'll tag your story automatically from what you link.</text><rect x="34" y="980" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="1023" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Post story</text></g></g>

ht="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">and the shelter is notified.</text><text x="270" y="652" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#a9adaa" text-anchor="middle" letter-spacing="0">No penalty — just pledge what you can deliver.</text><rect x="82" y="682" width="376" height="68" rx="34" fill="url(#v2danger)" filter="url(#v2soft)"/><text x="270" y="725" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Yes, cancel pledge</text><text x="270" y="786" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">Keep pledge</text></g></g>

    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Forgot password</text><circle cx="270" cy="200" r="52" fill="#e7f0ef"/><rect x="247" y="192.48" width="46" height="28.52" rx="3" fill="#1C6B6B"/><path d="M256.2 192.48 v-8.28 a13.799999999999999 13.799999999999999 0 0 1 27.599999999999998 0 v8.28" fill="none" stroke="#1C6B6B" stroke-width="5.52"/><text x="270" y="300" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1F3A5F" text-anchor="middle" letter-spacing="0">Forgot your password?</text><text x="270" y="342" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">No worries — we’ll email you a code</text><text x="270" y="372" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">to reset it.</text><rect x="34" y="432" width="472" height="82" rx="22" fill="#ffffff" filter="url(#v2soft)"/><text x="60" y="462" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5f5e5a" text-anchor="start" letter-spacing="0.4">Email</text><text x="60" y="496" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">ana@email.com</text><text x="34" y="556" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Use the email you signed up with.</text><rect x="34" y="620" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="663" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Send code</text><text x="270" y="748" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">Remembered it?  Log in</text></g></g>

    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Notifications</text><text x="506" y="144" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1C6B6B" text-anchor="end" letter-spacing="0">Mark all read</text><rect x="34" y="164" width="472" height="132" rx="24" fill="url(#v2hero)" filter="url(#v2sh)"/><circle cx="88" cy="230" r="30" fill="#ffffff"/><circle cx="88" cy="221.84" r="6.800000000000001" fill="#1C6B6B"/><path d="M75.76 244.28 a12.24 13.600000000000001 0 0 1 24.48 0 z" fill="#1C6B6B"/><circle cx="110" cy="252" r="11" fill="#ffffff"/><circle cx="110" cy="252" r="9" fill="#1C6B6B"/><polyline points="105.95,252 108.92,255.15 114.5,248.4" fill="none" stroke="#ffffff" stroke-width="1.98" stroke-linecap="round" stroke-linejoin="round"/><text x="134" y="208" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="0">You’re a Verified Member!</text><text x="134" y="234" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#cfe6e2" text-anchor="start" letter-spacing="0">Your ID checked out — you can now</text><text x="134" y="255" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#cfe6e2" text-anchor="start" letter-spacing="0">adopt and use rescue tools.</text><text x="134" y="282" font-family="Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="0">See your badge ›</text><text x="482" y="204" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#a9cfca" text-anchor="end" letter-spacing="0">2m</text><text x="34" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">New</text><rect x="34" y="350" width="472" height="112" rx="22" fill="#ffffff" filter="url(#v2sh)"/><rect x="48" y="384" width="44" height="44" rx="15" fill="#EAF3DE"/><polyline points="62,406 68,412 79,399" fill="none" stroke="#27500A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="386" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Shift confirmed</text><text x="468" y="386" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#b8b6ad" text-anchor="end" letter-spacing="0">20m</text><circle cx="487" cy="381" r="4.5" fill="#1C6B6B"/><text x="104" y="410" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">“Feed the rescue pack” (Sun, Jul 13) —</text><text x="104" y="432" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">added to your calendar.</text><rect x="34" y="474" width="472" height="112" rx="22" fill="#ffffff" filter="url(#v2sh)"/><rect x="48" y="508" width="44" height="44" rx="15" fill="#F3E3E1"/><line x1="62" y1="522" x2="78" y2="538" stroke="#8A3B3B" stroke-width="3.2" stroke-linecap="round"/><line x1="62" y1="538" x2="78" y2="522" stroke="#8A3B3B" stroke-width="3.2" stroke-linecap="round"/><text x="104" y="510" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Shift request declined</text><text x="468" y="510" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#b8b6ad" text-anchor="end" letter-spacing="0">1h</text><circle cx="487" cy="505" r="4.5" fill="#1C6B6B"/><text x="104" y="534" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">PAWS Manila couldn’t take your “Morning</text><text x="104" y="556" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">dog walk” request this time.</text><rect x="34" y="598" width="472" height="112" rx="22" fill="#ffffff" filter="url(#v2sh)"/><rect x="48" y="632" width="44" height="44" rx="15" fill="#e7f0ef"/><path d="M70 662.84 C 55.7 652.44, 58.56 642.04, 65.58 646.72 C 68.7 648.8, 71.3 648.8, 74.42 646.72 C 81.44 642.04, 84.3 652.44, 70 662.84 Z" fill="#1C6B6B"/><text x="104" y="634" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Adoption update</text><text x="468" y="634" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#b8b6ad" text-anchor="end" letter-spacing="0">3h</text><circle cx="487" cy="629" r="4.5" fill="#1C6B6B"/><text x="104" y="658" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">PAWS Manila moved your Milo inquiry to</text><text x="104" y="680" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Interview — step 4 of 6.</text><text x="34" y="740" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Earlier</text><rect x="34" y="758" width="472" height="112" rx="22" fill="#ffffff" filter="url(#v2sh)"/><rect x="48" y="792" width="44" height="44" rx="15" fill="#E4EEF0"/><circle cx="70" cy="814" r="15" fill="none" stroke="#1C6B6B" stroke-width="4"/><line x1="70" y1="814" x2="70" y2="805.75" stroke="#1C6B6B" stroke-width="4" stroke-linecap="round"/><line x1="70" y1="814" x2="76.3" y2="816.7" stroke="#1C6B6B" stroke-width="4" stroke-linecap="round"/><text x="104" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Shift tomorrow</text><text x="468" y="794" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#b8b6ad" text-anchor="end" letter-spacing="0">1d</text><text x="104" y="818" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">“Feed the rescue pack” is tomorrow —</text><text x="104" y="840" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Sun, Jul 13 · 9 AM. See you there!</text><rect x="34" y="882" width="472" height="112" rx="22" fill="#ffffff" filter="url(#v2sh)"/><rect x="48" y="916" width="44" height="44" rx="15" fill="#FAEEDA"/><circle cx="70" cy="938" r="13" fill="none" stroke="#633806" stroke-width="4"/><line x1="70" y1="932.15" x2="70" y2="939.56" stroke="#633806" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="943.85" r="2.8" fill="#633806"/><text x="104" y="918" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Shift cancelled</text><text x="468" y="918" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#b8b6ad" text-anchor="end" letter-spacing="0">1d</text><text x="104" y="942" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">“Morning dog walk” (Sat, Jul 12) was</text><text x="104" y="964" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">cancelled. Your slot was released.</text></g></g>

    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Decline inquiry</text><rect x="34" y="158" width="472" height="110" rx="20" fill="#ffffff" filter="url(#v2sh)"/><rect x="54" y="183" width="60" height="60" rx="18.6" fill="#e7f0ef"/><text x="84" y="221" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">AR</text><text x="132" y="203" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Ana Reyes</text><text x="132" y="231" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Adopting Milo · step 4 of 6</text><text x="34" y="336" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Decline this inquiry?</text><text x="34" y="376" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Ana will be notified. Milo returns to</text><text x="34" y="402" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">available so others can apply.</text><text x="34" y="458" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Reason (Ana will see this)</text><rect x="34" y="474" width="472" height="120" rx="16" fill="#ffffff" filter="url(#v2sh)"/><text x="58" y="514" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#9a988f" text-anchor="start" letter-spacing="0">e.g. The home isn't a fit for a large, active dog</text><text x="58" y="544" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#9a988f" text-anchor="start" letter-spacing="0">right now — we'd welcome a future application.</text><text x="34" y="632" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Saved as the shelter's note on the inquiry.</text><rect x="34" y="760" width="472" height="68" rx="34" fill="url(#v2danger)" filter="url(#v2soft)"/><text x="270" y="803" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Decline inquiry</text><text x="270" y="878" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">Keep reviewing</text></g></g>
    <rect x="240" y="44" width="120" height="30" rx="15" fill="#11241f"/>
  </svg>
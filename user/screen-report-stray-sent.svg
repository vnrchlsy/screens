    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Report sent</text><circle cx="270" cy="208" r="66" fill="#eaf3de"/><polyline points="240,208 262,230 300,188" fill="none" stroke="#27500A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="366" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Report sent</text><text x="270" y="404" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#5f5e5a" text-anchor="middle" letter-spacing="0">Rescuers near Marikina City have been alerted.</text><rect x="34" y="442" width="472" height="96" rx="20" fill="#ffffff" filter="url(#v2sh)"/><rect x="54" y="460" width="60" height="60" rx="18.6" fill="#e7f0ef"/><image href="data:image/png;base64," x="68" y="474" width="32" height="32"/><text x="134" y="482" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Dog · Injured</text><text x="134" y="510" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">12 Aurora Blvd, Marikina City</text><rect x="366" y="462" width="120" height="36" rx="18" fill="#FAEEDA"/><circle cx="382" cy="480" r="4" fill="#633806"/><text x="394" y="485.5" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#633806" text-anchor="start" letter-spacing="0">Reported</text><text x="34" y="594" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">What happens next</text><circle cx="52" cy="636" r="17" fill="#e7f0ef"/><text x="52" y="642" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">1</text><text x="84" y="642" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Nearby verified rescuers get an alert</text><circle cx="52" cy="688" r="17" fill="#e7f0ef"/><text x="52" y="694" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">2</text><text x="84" y="694" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Someone claims the case — you'll be told who</text><circle cx="52" cy="740" r="17" fill="#e7f0ef"/><text x="52" y="746" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">3</text><text x="84" y="746" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#1F3A5F" text-anchor="start" letter-spacing="0">You follow every update until it's resolved</text><rect x="34" y="812" width="472" height="76" rx="18" fill="#e7f0ef"/><circle cx="74" cy="850" r="18" fill="none" stroke="#1C6B6B" stroke-width="4"/><line x1="74" y1="850" x2="74" y2="840.1" stroke="#1C6B6B" stroke-width="4" stroke-linecap="round"/><line x1="74" y1="850" x2="81.56" y2="853.24" stroke="#1C6B6B" stroke-width="4" stroke-linecap="round"/><text x="106" y="844" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#14504F" text-anchor="start" letter-spacing="0">No one yet? It widens automatically.</text><text x="106" y="868" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Unclaimed reports alert a bigger radius.</text><rect x="34" y="924" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="967" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Track this report</text></g></g>

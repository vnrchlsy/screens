<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1230" viewBox="0 0 600 1230">
    <rect x="4" y="4" width="592" height="1222" rx="76" fill="#11241f"/>
    <rect x="30" y="30" width="540" height="1170" rx="48" fill="#ffffff"/>
    <clipPath id="sc"><rect x="30" y="30" width="540" height="1170" rx="48"/></clipPath>
    <defs>
  <filter id="v2sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1F3A5F" flood-opacity="0.10"/></filter>
  <filter id="v2soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3A5F" flood-opacity="0.08"/></filter>
  <linearGradient id="v2btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#238383"/><stop offset="1" stop-color="#14504F"/></linearGradient>
  <linearGradient id="v2danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C94A44"/><stop offset="1" stop-color="#9E322D"/></linearGradient>
  <linearGradient id="v2hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C6B6B"/><stop offset="1" stop-color="#11241F"/></linearGradient>
  <linearGradient id="v2fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F5F2" stop-opacity="0"/><stop offset="0.5" stop-color="#F4F5F2" stop-opacity="0.9"/><stop offset="1" stop-color="#F4F5F2"/></linearGradient>
</defs>
    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Delete account</text><text x="34" y="158" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="-0.5">This can't be undone</text><text x="34" y="196" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">You have 30 days to change your mind. After</text><text x="34" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">that, your personal details are erased for good.</text><rect x="34" y="254" width="230" height="296" rx="22" fill="#ffffff" filter="url(#v2sh)"/><text x="58" y="296" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#B23B3B" text-anchor="start" letter-spacing="0.6">REMOVED</text><circle cx="65" cy="330" r="4" fill="#B23B3B"/><text x="82" y="336" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Your name</text><text x="82" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">and photo</text><circle cx="65" cy="386" r="4" fill="#B23B3B"/><text x="82" y="392" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Phone, email</text><text x="82" y="414" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">and address</text><circle cx="65" cy="442" r="4" fill="#B23B3B"/><text x="82" y="448" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Your pets</text><text x="82" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">and listings</text><circle cx="65" cy="498" r="4" fill="#B23B3B"/><text x="82" y="504" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Saved places</text><rect x="276" y="254" width="230" height="296" rx="22" fill="#ffffff" filter="url(#v2sh)"/><text x="300" y="296" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#27500A" text-anchor="start" letter-spacing="0.6">KEPT, ANONYMOUS</text><circle cx="307" cy="330" r="4" fill="#27500A"/><text x="324" y="336" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Rescues you</text><text x="324" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">resolved</text><circle cx="307" cy="386" r="4" fill="#27500A"/><text x="324" y="392" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Adoptions</text><text x="324" y="414" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">completed</text><circle cx="307" cy="442" r="4" fill="#27500A"/><text x="324" y="448" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Shifts you</text><text x="324" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">volunteered</text><circle cx="307" cy="498" r="4" fill="#27500A"/><text x="324" y="504" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Shown as</text><text x="324" y="526" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">“Deleted user”</text><text x="34" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">These stay so the animals' records stay whole.</text><text x="34" y="614" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Nothing in them points back to you.</text><text x="34" y="680" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5f5e5a" text-anchor="start" letter-spacing="1.2">TYPE DELETE TO CONFIRM</text><rect x="34" y="698" width="472" height="84" rx="22" fill="#ffffff" filter="url(#v2soft)"/><text x="60" y="730" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5f5e5a" text-anchor="start" letter-spacing="0.4">CONFIRMATION</text><text x="60" y="762" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">DELETE</text><rect x="34" y="826" width="472" height="68" rx="34" fill="url(#v2danger)" filter="url(#v2soft)"/><text x="270" y="869" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Delete my account</text><rect x="34" y="914" width="472" height="64" rx="32" fill="#ffffff" filter="url(#v2soft)"/><text x="270" y="954" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">Keep my account</text></g></g>
    <rect x="240" y="44" width="120" height="30" rx="15" fill="#11241f"/>

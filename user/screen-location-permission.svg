hor="middle" letter-spacing="0">Allow location</text><text x="270" y="898" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">Enter it manually</text></g></g>

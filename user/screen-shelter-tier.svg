    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Shelter type</text><circle cx="174" cy="112" r="7" fill="#1C6B6B"/><circle cx="238" cy="112" r="7" fill="#cfd6d2"/><circle cx="302" cy="112" r="7" fill="#cfd6d2"/><circle cx="366" cy="112" r="7" fill="#cfd6d2"/><text x="34" y="168" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">What kind of rescue are you?</text><text x="34" y="204" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">This sets the documents we'll ask for.</text><rect x="34" y="262" width="472" height="200" rx="24" fill="#e7f0ef" stroke="#1C6B6B" stroke-width="1.5"/><circle cx="100" cy="352" r="44" fill="#1C6B6B"/><circle cx="100" cy="340" r="10" fill="#ffffff"/><path d="M82 373 a18 20 0 0 1 36 0 z" fill="#ffffff"/><text x="166" y="324" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Community rescue</text><text x="166" y="354" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">You take animals in at home or a</text><text x="166" y="378" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">small space — no SEC papers yet.</text><text x="58" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1C6B6B" text-anchor="start" letter-spacing="0">ID · address proof · photos of your space</text><circle cx="466" cy="296" r="17" fill="#1C6B6B"/><polyline points="458,296 463,302 474,289" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="486" width="472" height="200" rx="24" fill="#ffffff" filter="url(#v2sh)"/><circle cx="100" cy="576" r="44" fill="#e7f0ef"/><rect x="79" y="555" width="42" height="42" rx="4" fill="#1C6B6B"/><rect x="85.72" y="560.88" width="6.3" height="6.3" fill="#e7f0ef"/><rect x="97.48" y="560.88" width="6.3" height="6.3" fill="#e7f0ef"/><rect x="109.24000000000001" y="560.88" width="6.3" height="6.3" fill="#e7f0ef"/><rect x="85.72" y="571.8" width="6.3" height="6.3" fill="#e7f0ef"/><rect x="97.48" y="571.8" width="6.3" height="6.3" fill="#e7f0ef"/><rect x="109.24000000000001" y="571.8" width="6.3" height="6.3" fill="#e7f0ef"/><rect x="95.8" y="582.72" width="8.4" height="14.280000000000001" fill="#e7f0ef"/><text x="166" y="548" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Registered NGO / Foundation</text><text x="166" y="578" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">SEC-registered, with a BAI licence</text><text x="166" y="602" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">to operate.</text><text x="58" y="654" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1C6B6B" text-anchor="start" letter-spacing="0">Adds SEC, BAI &amp; your affiliated vet</text><text x="34" y="748" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Not registered yet? Start as a community rescue —</text><text x="34" y="772" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">you can upgrade once your SEC papers come through.</text><rect x="34" y="820" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="863" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Continue</text></g></g>

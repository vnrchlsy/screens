    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Base checks</text><circle cx="174" cy="112" r="7" fill="#1C6B6B"/><circle cx="238" cy="112" r="7" fill="#1C6B6B"/><circle cx="302" cy="112" r="7" fill="#1C6B6B"/><circle cx="366" cy="112" r="7" fill="#1C6B6B"/><text x="34" y="164" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Base checks</text><text x="34" y="198" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Step 1 of 2 — NGO papers come next.</text><rect x="34" y="236" width="472" height="96" rx="20" fill="#ffffff" filter="url(#v2sh)"/><rect x="56" y="258" width="52" height="52" rx="16.12" fill="#e7f0ef"/><text x="82" y="292" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">MS</text><text x="126" y="276" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Maria Santos</text><text x="126" y="302" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">hello@pawsmanila.org</text><circle cx="470" cy="264" r="9" fill="#EAF3DE"/><polyline points="466,264 469,267 474,260" fill="none" stroke="#27500A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="486" y="308" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#b8b6ad" text-anchor="end" letter-spacing="0">From your account</text><rect x="34" y="358" width="472" height="82" rx="22" fill="#ffffff" filter="url(#v2soft)"/><text x="60" y="388" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5f5e5a" text-anchor="start" letter-spacing="0.4">Proof of rescue activity</text><text x="60" y="422" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">facebook.com/pawsmanila</text><text x="34" y="460" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">A page or group showing your rescue work.</text><text x="34" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Documents</text><rect x="34" y="520" width="472" height="98" rx="20" fill="#ffffff" filter="url(#v2sh)"/><rect x="56" y="543" width="52" height="52" rx="16.12" fill="#e7f0ef"/><path d="M69 553 h18 l8 8 v24 h-26 z" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><path d="M87 553 v8 h8" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><line x1="76" y1="572" x2="91" y2="572" stroke="#1C6B6B" stroke-width="2.5"/><line x1="76" y1="580" x2="91" y2="580" stroke="#1C6B6B" stroke-width="2.5"/><text x="130" y="563" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Government-issued ID</text><text x="130" y="590" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Your valid ID · Required</text><circle cx="470" cy="569" r="15" fill="#EAF3DE"/><polyline points="464,569 468,574 477,563" fill="none" stroke="#27500A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="632" width="472" height="98" rx="20" fill="#ffffff" filter="url(#v2sh)"/><rect x="56" y="655" width="52" height="52" rx="16.12" fill="#e7f0ef"/><path d="M69 665 h18 l8 8 v24 h-26 z" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><path d="M87 665 v8 h8" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><line x1="76" y1="684" x2="91" y2="684" stroke="#1C6B6B" stroke-width="2.5"/><line x1="76" y1="692" x2="91" y2="692" stroke="#1C6B6B" stroke-width="2.5"/><text x="130" y="675" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Proof of billing</text><text x="130" y="702" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Utility bill for your address · Required</text><circle cx="470" cy="681" r="15" fill="#EAF3DE"/><polyline points="464,681 468,686 477,675" fill="none" stroke="#27500A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="758" width="472" height="98" rx="20" fill="#ffffff" filter="url(#v2sh)"/><rect x="56" y="781" width="52" height="52" rx="16.12" fill="#e7f0ef"/><rect x="70" y="795" width="24" height="24" rx="4" fill="none" stroke="#1C6B6B" stroke-width="2.5"/><circle cx="79" cy="803" r="3" fill="#1C6B6B"/><path d="M74 815 l7 -7 5 5 4 -4 4 4" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><text x="130" y="800" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Photos of your rescue space</text><text x="130" y="827" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">3 angles of the space · 1 of 3 added</text><text x="486" y="814" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1C6B6B" text-anchor="end" letter-spacing="0">Add ›</text><rect x="34" y="878" width="472" height="74" rx="18" fill="#eaf4f2"/><rect x="58" y="900" width="30" height="30" rx="8" fill="#1C6B6B"/><polyline points="65,915 71,922 82,908" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="910" font-family="Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1F3A5F" text-anchor="start" letter-spacing="0">I consent to Kupkop PH collecting these documents</text><text x="102" y="932" font-family="Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1F3A5F" text-anchor="start" letter-spacing="0">solely to verify our organisation.</text><rect x="34" y="990" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="1033" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Continue to NGO papers</text><text x="270" y="1094" font-family="Arial, sans-serif" font-size="16.5" font-weight="700" fill="#14504F" text-anchor="middle" letter-spacing="0">I'll upload these later</text><text x="270" y="1120" font-family="Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#b8b6ad" text-anchor="middle" letter-spacing="0">Your org stays hidden until we've checked them.</text></g></g>

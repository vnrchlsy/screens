><ellipse cx="462" cy="612" rx="15" ry="9.5" fill="none" stroke="#5f5e5a" stroke-width="2.4"/><circle cx="462" cy="612" r="4.5" fill="#5f5e5a"/><circle cx="47" cy="670" r="11" fill="none" stroke="#B23B3B" stroke-width="4"/><line x1="47" y1="665.05" x2="47" y2="671.32" stroke="#B23B3B" stroke-width="4" stroke-linecap="round"/><circle cx="47" cy="674.95" r="2.8" fill="#B23B3B"/><text x="68" y="676" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#B23B3B" text-anchor="start" letter-spacing="0">At least 8 characters, including a number.</text><text x="34" y="730" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Fix the fields above to continue.</text><rect x="34" y="770" width="472" height="68" rx="34" fill="#1C6B6B"/><text x="270" y="813" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Send code</text><text x="270" y="908" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">Already have an account?  Log in</text></g></g>

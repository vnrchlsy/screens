    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Resubmit documents</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">One document needs a fix</text><text x="34" y="202" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Replace it and resubmit — the rest are fine.</text><rect x="34" y="244" width="472" height="118" rx="20" fill="#FBEEEC" stroke="#E7C7C2" stroke-width="1.5"/><text x="58" y="284" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B23B3B" text-anchor="start" letter-spacing="1">REVIEWER NOTE</text><text x="58" y="318" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#1F3A5F" text-anchor="start" letter-spacing="0">The utility bill photo is unreadable —</text><text x="58" y="344" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#1F3A5F" text-anchor="start" letter-spacing="0">please re-upload a clearer copy.</text><text x="34" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Your documents</text><rect x="34" y="440" width="472" height="106" rx="20" fill="#ffffff" filter="url(#v2sh)"/><circle cx="86" cy="493" r="30" fill="#e7f0ef"/><path d="M73 477 h18 l8 8 v24 h-26 z" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><path d="M91 477 v8 h8" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><line x1="80" y1="496" x2="95" y2="496" stroke="#1C6B6B" stroke-width="2.5"/><line x1="80" y1="504" x2="95" y2="504" stroke="#1C6B6B" stroke-width="2.5"/><text x="140" y="486" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Government-issued ID</text><text x="140" y="514" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">maria-id.jpg</text><circle cx="470" cy="493" r="16" fill="#EAF3DE"/><polyline points="463,493 468,499 478,486" fill="none" stroke="#27500A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="562" width="472" height="106" rx="20" fill="#ffffff" stroke="#E7C7C2" stroke-width="1.5"/><circle cx="86" cy="615" r="30" fill="#FBEEEC"/><path d="M73 599 h18 l8 8 v24 h-26 z" fill="none" stroke="#B23B3B" stroke-width="2.5" stroke-linejoin="round"/><path d="M91 599 v8 h8" fill="none" stroke="#B23B3B" stroke-width="2.5" stroke-linejoin="round"/><line x1="80" y1="618" x2="95" y2="618" stroke="#B23B3B" stroke-width="2.5"/><line x1="80" y1="626" x2="95" y2="626" stroke="#B23B3B" stroke-width="2.5"/><text x="140" y="608" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Proof of billing</text><text x="140" y="636" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#B23B3B" text-anchor="start" letter-spacing="0">meralco-bill.pdf · unreadable</text><rect x="414" y="593" width="92" height="44" rx="22" fill="url(#v2danger)"/><text x="460" y="621" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Replace</text><rect x="34" y="684" width="472" height="106" rx="20" fill="#ffffff" filter="url(#v2sh)"/><circle cx="86" cy="737" r="30" fill="#e7f0ef"/><path d="M73 721 h18 l8 8 v24 h-26 z" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><path d="M91 721 v8 h8" fill="none" stroke="#1C6B6B" stroke-width="2.5" stroke-linejoin="round"/><line x1="80" y1="740" x2="95" y2="740" stroke="#1C6B6B" stroke-width="2.5"/><line x1="80" y1="748" x2="95" y2="748" stroke="#1C6B6B" stroke-width="2.5"/><text x="140" y="730" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Photos of rescue space</text><text x="140" y="758" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">3 photos</text><circle cx="470" cy="737" r="16" fill="#EAF3DE"/><polyline points="463,737 468,743 478,730" fill="none" stroke="#27500A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="838" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Only the flagged file is replaced — the others stay.</text><rect x="34" y="884" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="927" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Resubmit for review</text><text x="270" y="990" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#b8b6ad" text-anchor="middle" letter-spacing="0">Back to under review · usually 1–2 business days</text></g></g>

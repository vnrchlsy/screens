    <g clip-path="url(#sc)"><g transform="translate(30,30)"><rect width="540" height="1170" fill="#F4F5F2"/><text x="34" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">9:41</text><circle cx="486" cy="32" r="5" fill="#1F3A5F"/><circle cx="502" cy="32" r="5" fill="#1F3A5F"/><rect x="470" y="22" width="40" height="18" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2"/><circle cx="56" cy="66" r="22" fill="#ffffff" filter="url(#v2soft)"/><text x="56" y="76" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12213A" text-anchor="middle" letter-spacing="0">‹</text><text x="270" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#12213A" text-anchor="middle" letter-spacing="0">Contact details</text><circle cx="174" cy="112" r="7" fill="#1C6B6B"/><circle cx="238" cy="112" r="7" fill="#1C6B6B"/><circle cx="302" cy="112" r="7" fill="#1C6B6B"/><circle cx="366" cy="112" r="7" fill="#cfd6d2"/><text x="34" y="168" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">How can people reach you?</text><text x="34" y="202" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Adopters see this — our reviewers check it.</text><rect x="34" y="252" width="472" height="82" rx="22" fill="#ffffff" filter="url(#v2soft)"/><text x="60" y="282" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5f5e5a" text-anchor="start" letter-spacing="0.4">Contact person</text><text x="60" y="316" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">Maria Santos</text><circle cx="44" cy="348" r="8" fill="#EAF3DE"/><polyline points="40,348 43,351 48,344" fill="none" stroke="#27500A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="353" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">From your account — change if someone else is the contact.</text><text x="34" y="388" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start" letter-spacing="0">Their role</text><rect x="34" y="404" width="94" height="52" rx="26" fill="#1C6B6B" stroke="#1C6B6B" stroke-width="1.5"/><text x="81" y="438" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Owner</text><rect x="142" y="404" width="94" height="52" rx="26" fill="#ffffff" filter="url(#v2sh)"/><text x="189" y="438" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle" letter-spacing="0">Staff</text><rect x="250" y="404" width="142" height="52" rx="26" fill="#ffffff" filter="url(#v2sh)"/><text x="321" y="438" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle" letter-spacing="0">Volunteer</text><rect x="34" y="488" width="472" height="82" rx="22" fill="#ffffff" filter="url(#v2soft)"/><text x="60" y="518" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5f5e5a" text-anchor="start" letter-spacing="0.4">Contact number</text><text x="60" y="552" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1C6B6B" text-anchor="start" letter-spacing="0">+63</text><text x="126" y="552" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">917 123 4567</text><text x="34" y="594" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">We’ll text a code to verify this number.</text><rect x="34" y="628" width="472" height="82" rx="22" fill="#ffffff" filter="url(#v2soft)"/><text x="60" y="658" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5f5e5a" text-anchor="start" letter-spacing="0.4">Website / Facebook page</text><text x="60" y="692" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12213A" text-anchor="start" letter-spacing="0">facebook.com/pawsmanila</text><rect x="34" y="738" width="472" height="76" rx="16" fill="#eaf4f2"/><circle cx="74" cy="776" r="17" fill="#1C6B6B"/><circle cx="74" cy="771.2" r="4" fill="#ffffff"/><path d="M66.8 784.4 a7.199999999999999 8 0 0 1 14.399999999999999 0 z" fill="#ffffff"/><text x="104" y="770" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14504F" text-anchor="start" letter-spacing="0">Who are we talking to?</text><text x="104" y="794" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">The role helps our reviewers verify your org.</text><rect x="34" y="848" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="891" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Continue</text><text x="270" y="952" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#b8b6ad" text-anchor="middle" letter-spacing="0">Documents come next — you can save and finish later.</text></g></g>

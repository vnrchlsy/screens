 y="474" width="472" height="112" rx="22" fill="#ffffff" filter="url(#v2sh)"/><rect x="48" y="508" width="44" height="44" rx="15" fill="#ECEBF6"/><circle cx="70" cy="525.24" r="4.800000000000001" fill="#5b53a6"/><path d="M61.36 541.08 a8.64 9.600000000000001 0 0 1 17.28 0 z" fill="#5b53a6"/><text x="104" y="510" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">New volunteer sign-up</text><text x="468" y="510" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#b8b6ad" text-anchor="end" letter-spacing="0">2h</text><circle cx="487" cy="505" r="4.5" fill="#1C6B6B"/><text x="104" y="534" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Jose Cruz requested “Morning dog walk”</text><text x="104" y="556" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">(Sat, Jul 12). Approve or decline.</text><text x="34" y="616" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Earlier</text><rect x="34" y="634" width="472" height="90" rx="22" fill="#ffffff" filter="url(#v2sh)"/><rect x="48" y="657" width="44" height="44" rx="15" fill="#FAEEDA"/><circle cx="70" cy="679" r="13" fill="none" stroke="#633806" stroke-width="4"/><line x1="70" y1="673.15" x2="70" y2="680.56" stroke="#633806" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="684.85" r="2.8" fill="#633806"/><text x="104" y="670" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#12213A" text-anchor="start" letter-spacing="0">Inquiry withdrawn</text><text x="468" y="670" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#b8b6ad" text-anchor="end" letter-spacing="0">1d</text><text x="104" y="694" font-family="Arial, sans-serif" font-size="13.5" font-weight="normal" fill="
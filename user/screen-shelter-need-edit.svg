 sans-serif" font-size="16" font-weight="normal" fill="#9a988f" text-anchor="start" letter-spacing="0">Any brand/size, drop-off hours…</text><text x="34" y="774" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#5f5e5a" text-anchor="start" letter-spacing="0">Donors who already pledged keep their pledge.</text><rect x="34" y="812" width="472" height="68" rx="34" fill="url(#v2btn)" filter="url(#v2soft)"/><text x="270" y="855" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Save changes</text><text x="270" y="916" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1C6B6B" text-anchor="middle" letter-spacing="0">Mark as complete ›</text></g></g>
